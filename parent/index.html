<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/jpeg" href="/logo.jpeg" />
    <title>Cambridge Education System — Parent Portal</title>
    <meta name="description" content="Parent portal for Cambridge Education System: your children's attendance, fees, results, assignments, learning resources, achievements and school notices." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Work+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var legacyKeys = [
            'iqra_principal_portal_auth_token_v1',
            'iqra_principal_portal_remember_email',
            'iqra_principal_portal_db_clean_v4',
            'iqra_teacher_auth_token',
            'iqra_student_auth_token',
            'iqra_parent_auth_token'
          ];
          for (var i = 0; i < legacyKeys.length; i++) {
            localStorage.removeItem(legacyKeys[i]);
          }
          for (var j = localStorage.length - 1; j >= 0; j--) {
            var k = localStorage.key(j);
            if (k && (k.indexOf('iqra_') === 0 || k.toLowerCase().indexOf('token') !== -1 || k.toLowerCase().indexOf('auth') !== -1)) {
              localStorage.removeItem(k);
            }
          }
          sessionStorage.clear();
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
