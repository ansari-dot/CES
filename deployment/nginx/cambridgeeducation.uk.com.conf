# ==============================================================================
# Cambridge Education System — Production Nginx Configuration
# Domain: cambridgeeducation.uk.com
# Portals:
#   - principle.cambridgeeducation.uk.com ➔ Principal & Admin Portal
#   - faculty.cambridgeeducation.uk.com   ➔ Teacher & Faculty Portal
#   - student.cambridgeeducation.uk.com   ➔ Student Portal
#   - parent.cambridgeeducation.uk.com    ➔ Parent & Guardian Portal
#   - api.cambridgeeducation.uk.com       ➔ Node.js REST API & WebSockets (Port 4000)
#
# ZERO CORS ARCHITECTURE: Every portal proxies /api/ and /socket.io/ to 127.0.0.1:4000
# ==============================================================================

upstream ces_backend_upstream {
    server 127.0.0.1:4000;
    keepalive 64;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# ------------------------------------------------------------------------------
# 1. PRINCIPAL & ADMIN PORTAL
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name principle.cambridgeeducation.uk.com;

    # Project path placeholder (auto-adjusted by setup script or defaults to current deployment)
    root /var/www/Cambridge-Education-system-/principle/dist;
    index index.html;

    client_max_body_size 50M;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # API Proxy (Zero CORS — strictly same-origin)
    location /api/ {
        proxy_pass http://ces_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Real-time WebSocket Proxy
    location /socket.io/ {
        proxy_pass http://ces_backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

