# ==============================================================================
# Cambridge Education System - Nginx Subdomains Configuration (Production)
#
# Recommended Domain Architecture:
#   - admin.yourdomain.com   -> Principal / Admin Portal (/principle/dist)
#   - teacher.yourdomain.com -> Teacher Portal (/teacher/dist)
#   - student.yourdomain.com -> Student Portal (/student/dist)
#   - parent.yourdomain.com  -> Parent Portal (/parent/dist)
#   - api.yourdomain.com     -> Backend REST API & Real-time WebSockets
#
# Replace "yourdomain.com" with your actual registered domain name.
# Replace "/var/www/ces" with your actual project root path on your VPS.
# ==============================================================================

# Common upstream for Node.js Express backend
upstream ces_backend {
    server 127.0.0.1:5000;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# 1. PRINCIPAL & ADMIN PORTAL (admin.yourdomain.com)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name admin.yourdomain.com;

    root /var/www/ces/principle/dist;
    index index.html;

    client_max_body_size 50M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Frontend Single Page Application (SPA) routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets caching
    location ~* \.(?:css|js|woff2?|svg|png|jpg|jpeg|gif|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # API Proxy (Prevents CORS issues by making API calls same-origin)
    location /api/ {
        proxy_pass http://ces_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 120s;
    }

    # Real-time WebSocket Proxy (Socket.IO)
    location /socket.io/ {
        proxy_pass http://ces_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }
}

