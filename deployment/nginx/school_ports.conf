# ==============================================================================
# Cambridge Education System - Nginx Single Domain with Port Mappings
#
# Use this configuration if you have only ONE domain or direct VPS IP:
#   - Port 80/443 -> Principal / Admin Portal
#   - Port 3001   -> Teacher Portal
#   - Port 3002   -> Student Portal
#   - Port 3003   -> Parent Portal
#   - All ports proxy /api/ and /socket.io/ to 127.0.0.1:5000 (ZERO CORS issues!)
# ==============================================================================

upstream ces_backend_common {
    server 127.0.0.1:5000;
    keepalive 64;
}

# Principal / Admin (Port 80)
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /var/www/ces/principle/dist;
    index index.html;
    client_max_body_size 50M;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ^~ /api/ {
        proxy_pass http://ces_backend_common;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /socket.io/ {
        proxy_pass http://ces_backend_common;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400s;
    }
}

